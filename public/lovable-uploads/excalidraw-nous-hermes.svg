<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Comic Sans MS','Segoe Print',cursive">
  <defs>
    <filter id="sketch2"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
    <marker id="arrowH" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#f8f6f0"/>
  <text x="40" y="50" fill="#1e1e1e" font-size="26" font-weight="700">Nous Hermes: Autonomous Job Agent</text>

  <g filter="url(#sketch2)" fill="none" stroke="#1e1e1e" stroke-width="2.5" stroke-dasharray="6 4">
    <rect x="60" y="110" width="880" height="420" rx="6"/>
  </g>
  <text x="90" y="140" fill="#495057" font-size="15" font-style="italic">Hostinger VPS, Docker, runs 24/7</text>

  <g filter="url(#sketch2)" fill="none" stroke="#1e1e1e" stroke-width="2.5">
    <rect x="400" y="280" width="200" height="100" rx="6"/>
    <rect x="90" y="220" width="190" height="70" rx="6"/>
    <rect x="90" y="400" width="190" height="70" rx="6"/>
    <rect x="720" y="220" width="190" height="70" rx="6"/>
    <rect x="720" y="400" width="190" height="70" rx="6"/>
    <rect x="410" y="180" width="180" height="60" rx="6"/>
  </g>

  <g fill="#1e1e1e" font-size="16" text-anchor="middle" font-weight="700">
    <text x="500" y="325">Hermes Agent</text>
  </g>
  <g fill="#1e1e1e" font-size="13" text-anchor="middle">
    <text x="500" y="350">reason . score . learn</text>

    <text x="185" y="252">Telegram</text>
    <text x="185" y="270" font-size="11">talk to it anytime</text>

    <text x="185" y="432">Scheduler</text>
    <text x="185" y="450" font-size="11">6PM + 1AM daily</text>

    <text x="815" y="252">4 job boards</text>
    <text x="815" y="270" font-size="11">scraped twice/day</text>

    <text x="815" y="432">Persistent memory</text>
    <text x="815" y="450" font-size="11">never repeats a job</text>

    <text x="500" y="212" font-weight="700" font-size="15">Claude Haiku</text>
  </g>

  <g filter="url(#sketch2)" stroke="#e8590c" stroke-width="2.5" fill="none" marker-end="url(#arrowH)">
    <path d="M280 260 L398 300"/>
    <path d="M280 430 L398 360"/>
    <path d="M720 260 L602 300"/>
    <path d="M720 430 L602 360"/>
    <path d="M500 280 L500 242"/>
  </g>

  <text x="500" y="570" fill="#495057" font-size="14" text-anchor="middle" font-style="italic">a self-improving agent that hunts jobs while I sleep</text>
</svg>
