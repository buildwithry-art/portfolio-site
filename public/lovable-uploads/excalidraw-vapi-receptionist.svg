<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'Comic Sans MS','Segoe Print',cursive">
  <defs>
    <filter id="sketch1"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
    <marker id="arrowV" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#1e1e1e" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="1000" height="600" fill="#f8f6f0"/>
  <text x="40" y="50" fill="#1e1e1e" font-size="26" font-weight="700">VAPI AI Receptionist</text>

  <g filter="url(#sketch1)" fill="none" stroke="#1e1e1e" stroke-width="2.5">
    <rect x="50" y="120" width="160" height="80" rx="4"/>
    <rect x="300" y="120" width="180" height="90" rx="4"/>
    <rect x="570" y="90" width="190" height="70" rx="4"/>
    <rect x="570" y="220" width="190" height="70" rx="4"/>
    <rect x="820" y="90" width="150" height="70" rx="4"/>
    <rect x="820" y="220" width="150" height="70" rx="4"/>
    <rect x="300" y="340" width="180" height="80" rx="4"/>
    <rect x="570" y="360" width="190" height="70" rx="4"/>
  </g>

  <g fill="#1e1e1e" font-size="15" text-anchor="middle" font-weight="600">
    <text x="130" y="165">Caller</text>
    <text x="130" y="185" font-size="12" font-weight="400">rings in</text>

    <text x="390" y="160">VAPI Assistant</text>
    <text x="390" y="180" font-size="12" font-weight="400">LLM + voice,</text>
    <text x="390" y="196" font-size="12" font-weight="400">qualifies caller</text>

    <text x="665" y="118">check_availability()</text>
    <text x="665" y="138" font-size="12" font-weight="400">-&gt; Make.com webhook</text>

    <text x="665" y="248">book_appointment()</text>
    <text x="665" y="268" font-size="12" font-weight="400">-&gt; Make.com webhook</text>

    <text x="895" y="120">GHL Calendar</text>
    <text x="895" y="140" font-size="12" font-weight="400">+ Appointment</text>

    <text x="895" y="250">Supabase</text>
    <text x="895" y="270" font-size="12" font-weight="400">job + call logs</text>

    <text x="390" y="378">SMS Confirmation</text>
    <text x="390" y="398" font-size="12" font-weight="400">via GHL</text>

    <text x="665" y="390">Transcript + duration</text>
    <text x="665" y="408" font-size="12" font-weight="400">logged to Supabase</text>
  </g>

  <g filter="url(#sketch1)" stroke="#e03131" stroke-width="2.5" fill="none" marker-end="url(#arrowV)">
    <path d="M210 160 L298 160"/>
    <path d="M480 150 L568 125"/>
    <path d="M480 190 L568 250"/>
    <path d="M760 125 L818 125"/>
    <path d="M760 255 L818 255"/>
  </g>
  <g filter="url(#sketch1)" stroke="#1971c2" stroke-width="2.5" fill="none" marker-end="url(#arrowV)">
    <path d="M390 210 L390 338"/>
    <path d="M480 380 L568 390"/>
  </g>

  <text x="500" y="560" fill="#495057" font-size="14" text-anchor="middle" font-style="italic">hand-sketched architecture, VAPI + Make + GoHighLevel + Supabase</text>
</svg>
